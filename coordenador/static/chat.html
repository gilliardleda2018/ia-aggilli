<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat com a ANI — Aggilli</title>
  <link rel="stylesheet" href="/static/ani.css?v=2">
</head>
<body class="chat-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="ANI, página inicial"><img class="brand-mark" src="/static/aggilli-mark.webp" alt="" width="40" height="32"><span>ANI</span></a>
      <nav aria-label="Navegação principal">
        <a class="button button-outline" href="/"><span aria-hidden="true">←</span> Início</a>
      </nav>
    </div>
  </header>
  <main class="container chat-shell">
    <h1>Converse com a ANI</h1>
    <div class="workspace">
      <aside class="chat-sidebar" aria-label="Conversas">
        <p class="sidebar-title">Conversas</p>
        <button class="button button-outline new-chat" id="new-chat" type="button">＋ Nova conversa</button>
        <div class="session-list" id="session-list"></div>
        <p>Histórico disponível até recarregar a página.</p>
      </aside>
      <section class="chat-section" aria-labelledby="conversation-title">
        <div class="chat-titlebar">
          <strong id="conversation-title">Nova conversa</strong>
          <span class="service-status" id="service-status" role="status"><span class="signal" aria-hidden="true"></span><span id="status-badge">Conectando…</span></span>
        </div>
        <div class="chat-mensagens" id="mensagens" role="log" aria-label="Mensagens da conversa">
          <div class="msg ani">
            <div class="msg-avatar"><img src="/static/ani-profile.webp" alt="ANI"></div>
            <div class="msg-bubble">Olá! Sou a <strong>ANI</strong>, a IA experimental da Aggilli. Como posso te ajudar?</div>
          </div>
        </div>
        <div class="sugestoes" id="sugestoes" aria-label="Perguntas sugeridas">
          <button class="sugestao" type="button" onclick="perguntar('Quem é você, ANI?')">Quem é você?</button>
          <button class="sugestao" type="button" onclick="perguntar('Como você aprende de forma distribuída?')">Como você aprende?</button>
          <button class="sugestao" type="button" onclick="perguntar('Como posso contribuir com seu treino?')">Como contribuir?</button>
        </div>
        <form class="composer" id="composer">
          <textarea id="input" aria-label="Mensagem para a ANI" placeholder="Escreva uma mensagem…" rows="1"></textarea>
          <button class="button button-primary" id="btn" type="submit">Enviar <span aria-hidden="true">↑</span></button>
        </form>
      </section>
    </div>
  </main>
  <script src="/static/chat.js?v=2" defer></script>
</body>
</html>
